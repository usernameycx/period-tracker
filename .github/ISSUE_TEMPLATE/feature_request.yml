name: 功能建议
description: 提一个新功能或改进想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看看 [路线图](https://github.com/usernameycx/period-tracker#路线图)，说不定已经在计划里了。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案 —— 问题讲清楚了，方案往往不止一个
      placeholder: 每次到黄体期我都会忘记提前准备，希望 App 能……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案

  - type: checkboxes
    id: scope
    attributes:
      label: 这个改动是否涉及
      options:
        - label: 需要联网 / 云服务（本项目坚持本地优先，需要额外讨论）
        - label: 需要修改原生代码（`android/`）
        - label: 需要修改周期预测算法（JS 与 Kotlin 需同步改）
        - label: 我可以自己提 PR
