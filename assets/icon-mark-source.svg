<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm amber upper -->
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B68A"/>
      <stop offset="100%" stop-color="#C2905A"/>
    </linearGradient>

    <!-- Botanical lower -->
    <linearGradient id="botanicalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F2EA" stop-opacity="0.60"/>
      <stop offset="40%" stop-color="#E8DDD0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#D4C5B0" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="100%" stop-color="#F8F2EA"/>
    </radialGradient>

    <clipPath id="circleMask">
      <circle cx="256" cy="256" r="220"/>
    </clipPath>

    <mask id="crescentMask">
      <circle cx="320" cy="188" r="46" fill="white"/>
      <circle cx="340" cy="180" r="36" fill="black"/>
    </mask>
  </defs>

  <!-- Background disc -->
  <circle cx="256" cy="256" r="220" fill="#F8F2EA"/>

  <!-- Upper amber -->
  <rect x="36" y="36" width="440" height="224" fill="url(#amberGrad)" clip-path="url(#circleMask)"/>

  <!-- Lower botanical -->
  <rect x="36" y="256" width="440" height="220" fill="url(#botanicalGrad)" clip-path="url(#circleMask)"/>

  <!-- The Wave — sine curve across diameter -->
  <path d="M 36,256
           C 48,251  60,271  72,256
           C 84,241  96,271  108,256
           C 120,241 132,271 144,256
           C 156,241 168,271 180,256
           C 192,241 204,271 216,256
           C 228,241 240,271 256,256
           C 268,241 280,271 292,256
           C 304,241 316,271 328,256
           C 340,241 352,271 364,256
           C 376,241 388,271 400,256
           C 412,241 424,271 436,256
           C 448,241 460,271 472,256
           C 476,253 476,259 476,259"
        fill="none" stroke="#5D7A5F" stroke-width="2.4" stroke-linecap="round"
        clip-path="url(#circleMask)" opacity="0.75"/>

  <!-- Wave highlight -->
  <path d="M 36,254
           C 48,249  60,269  72,254
           C 84,239  96,269  108,254
           C 120,239 132,269 144,254
           C 156,239 168,269 180,254
           C 192,239 204,269 216,254
           C 228,239 240,269 256,254
           C 268,239 280,269 292,254
           C 304,239 316,269 328,254
           C 340,239 352,269 364,254
           C 376,239 388,269 400,254
           C 412,239 424,269 436,254
           C 448,239 460,269 472,254
           C 476,252 476,256 476,256"
        fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="0.6"
        clip-path="url(#circleMask)"/>

  <!-- Under-wave echo -->
  <path d="M 36,276
           C 116,292 196,260 276,276
           C 356,292 416,260 476,276"
        fill="none" stroke="rgba(93,122,95,0.12)" stroke-width="12"
        clip-path="url(#circleMask)"/>

  <!-- Crescent Moon -->
  <g mask="url(#crescentMask)">
    <circle cx="320" cy="188" r="46" fill="url(#moonGlow)" opacity="0.92"/>
  </g>

  <!-- Stars -->
  <g fill="rgba(194,144,90,0.70)">
    <circle cx="288" cy="226" r="2.4"/>
    <circle cx="345" cy="162" r="1.4"/>
    <circle cx="208" cy="176" r="1.8"/>
    <circle cx="186" cy="210" r="1.4"/>
    <circle cx="370" cy="238" r="1.6"/>
    <circle cx="154" cy="156" r="1.1"/>
    <circle cx="342" cy="136" r="1.1"/>
    <circle cx="244" cy="146" r="1.3"/>
  </g>

  <!-- Disc border -->
  <circle cx="256" cy="256" r="219.5" fill="none" stroke="#C2905A" stroke-width="0.8" opacity="0.35"/>
  <circle cx="256" cy="256" r="218.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.4"/>
</svg>
